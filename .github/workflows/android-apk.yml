name: Android APK

# 每次 git push（含普通分支与 v* 标签）以及手动触发时，都会构建一个可直接安装的 debug APK。
# debug APK 使用 Android 默认 debug 证书签名；正式发布仍应在本地或后续 CI 中配置 release 签名。
on:
  push:
  workflow_dispatch:

# 同一个分支/标签的新推送会取消旧任务，节省 Actions 配额。
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: 测试并打包 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 初始化 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 单元测试与静态检查
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: 打包 debug APK
        run: bash scripts/build-android-mac.sh debug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ebook-debug-apk-${{ github.sha }}
          path: |
            releases/android/*.apk
            releases/android/*.sha256
          if-no-files-found: error
          retention-days: 14
